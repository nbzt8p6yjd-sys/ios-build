name: Publish iOS Hook Dylib

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compile libIOSVISION.dylib (server-redirect hook)
        run: |
          mv hook_engine_ios_final.cpp hook_engine_ios_final.mm
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -target arm64-apple-ios12.0 -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -std=c++17 -I. \
            -framework Foundation -framework UIKit \
            -install_name @rpath/libIOSVISION.dylib \
            hook_engine_ios_final.mm fishhook.c \
            -o libIOSVISION.dylib

      - name: Ad-hoc codesign (avoid unsigned dylib rejected by dyld)
        run: codesign --force --sign - libIOSVISION.dylib || true

      - name: Verify
        run: |
          file libIOSVISION.dylib
          lipo -info libIOSVISION.dylib
          otool -L libIOSVISION.dylib

      - name: Publish dylib to repo (fetchable via api.github.com from sandbox)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64 -i libIOSVISION.dylib | tr -d '\n' > dylib.b64
          CONTENT=$(cat dylib.b64)
          echo "b64 bytes: $(wc -c < dylib.b64)"
          URL="https://api.github.com/repos/nbzt8p6yjd-sys/ios-build/contents/dist/libIOSVISION.dylib"
          put() {
            local msg="$1"; local body="$2"
            curl -s -o resp.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "$body" "$URL"
          }
          HTTP=$(put "add" "{\"message\":\"ci: add libIOSVISION.dylib\",\"content\":\"$CONTENT\"}")
          echo "create HTTP=$HTTP"
          if [ "$HTTP" = "422" ] || [ "$HTTP" = "409" ]; then
            SHA=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$URL" | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
            HTTP=$(put "update" "{\"message\":\"ci: update libIOSVISION.dylib\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}")
            echo "update HTTP=$HTTP"
          fi
          echo "{\"message\":\"ci: add libIOSVISION.dylib\"}" > /dev/null
          cat resp.json | head -c 300; echo
