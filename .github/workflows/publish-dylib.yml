name: Publish iOS Hook Dylib

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compile libIOSVISION.dylib (server-redirect hook)
        run: |
          mv hook_engine_ios_final.cpp hook_engine_ios_final.mm
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -target arm64-apple-ios12.0 -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -std=c++17 -I. \
            -framework Foundation -framework UIKit \
            -install_name @rpath/libIOSVISION.dylib \
            hook_engine_ios_final.mm fishhook.c \
            -o libIOSVISION.dylib

      - name: Ad-hoc codesign (avoid unsigned dylib rejected by dyld)
        run: codesign --force --sign - libIOSVISION.dylib || true

      - name: Verify
        run: |
          file libIOSVISION.dylib
          lipo -info libIOSVISION.dylib
          otool -L libIOSVISION.dylib

      - name: Publish dylib to repo (fetchable via api.github.com from sandbox)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base64 -w0 libIOSVISION.dylib > dylib.b64
          CONTENT=$(cat dylib.b64)
          SHA=$(gh api repos/nbzt8p6yjd-sys/ios-build/contents/dist/libIOSVISION.dylib --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/nbzt8p6yjd-sys/ios-build/contents/dist/libIOSVISION.dylib -f message="ci: update libIOSVISION.dylib" -f content="$CONTENT" -f sha="$SHA"
          else
            gh api -X PUT repos/nbzt8p6yjd-sys/ios-build/contents/dist/libIOSVISION.dylib -f message="ci: add libIOSVISION.dylib" -f content="$CONTENT"
          fi
          echo "PUBLISHED dylib to dist/libIOSVISION.dylib"
