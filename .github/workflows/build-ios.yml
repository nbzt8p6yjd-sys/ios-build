name: Build iOS Hook Dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fetch fishhook (GOT rebinding, arm64e-safe — replaces Dobby)
        run: |
          curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o fishhook.c
          curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o fishhook.h
          ls -l fishhook.c fishhook.h

      - name: Compile libIOSVISION.dylib
        run: |
          mv hook_engine_ios_final.cpp hook_engine_ios_final.mm
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -target arm64-apple-ios12.0 -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -std=c++17 \
            -framework Foundation -framework UIKit \
            -install_name @rpath/libIOSVISION.dylib \
            hook_engine_ios_final.mm fishhook.c \
            -o libIOSVISION.dylib

      - name: Ad-hoc codesign (avoid unsigned dylib rejected by dyld)
        run: |
          codesign --force --sign - libIOSVISION.dylib || true
          codesign -dvv libIOSVISION.dylib 2>&1 | head -20 || true

      - name: Verify
        run: |
          file libIOSVISION.dylib
          lipo -info libIOSVISION.dylib
          otool -L libIOSVISION.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: libIOSVISION.dylib
          path: libIOSVISION.dylib
