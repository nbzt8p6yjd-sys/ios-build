name: Build iOS Hook Dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compile libIOSVISION.dylib (DYLD_INTERPOSE — no fishhook dependency)
        run: |
          mv hook_engine_ios_final.cpp hook_engine_ios_final.mm
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -target arm64-apple-ios12.0 -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -std=c++17 \
            -framework Foundation -framework UIKit \
            -install_name @rpath/libIOSVISION.dylib \
            hook_engine_ios_final.mm \
            -o libIOSVISION.dylib

      - name: Compile EMPTY isolation dylib (no ctor / no hook / no framework)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -target arm64-apple-ios12.0 -isysroot "$SDK" \
            -dynamiclib -std=c++17 \
            -install_name @executable_path/Frameworks/libIOSVISION.dylib \
            empty_dylib.cpp \
            -o libIOSVISION_empty.dylib

      - name: Ad-hoc codesign (avoid unsigned dylib rejected by dyld)
        run: |
          codesign --force --sign - libIOSVISION.dylib || true
          codesign --force --sign - libIOSVISION_empty.dylib || true
          codesign -dvv libIOSVISION.dylib 2>&1 | head -20 || true

      - name: Verify
        run: |
          file libIOSVISION.dylib
          lipo -info libIOSVISION.dylib
          otool -L libIOSVISION.dylib

      - name: Emit dylib base64 (CI bridge)
        run: |
          echo "DylibB64Begin"
          base64 libIOSVISION.dylib
          echo "DylibB64End"


      - uses: actions/upload-artifact@v4
        with:
          name: ios-dylibs
          path: |
            libIOSVISION.dylib
            libIOSVISION_empty.dylib
