name: Build iOS Hook

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Compile dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        clang++ -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=12.0 \
          -framework Foundation \
          -framework GameKit \
          -I. \
          -shared -fPIC -O2 \
          hook_engine_ios_final.cpp \
          libdobby.a \
          -o libIOSVISION.dylib

    - name: Verify
      run: |
        echo "=== Build Result ==="
        file libIOSVISION.dylib
        lipo -info libIOSVISION.dylib
        ls -lh libIOSVISION.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libIOSVISION
        path: libIOSVISION.dylib
        retention-days: 7
