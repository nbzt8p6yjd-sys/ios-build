name: Build iOS Hook Dylib + Inject IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compile libIOSVISION.dylib (fishhook rebind_symbols)
        run: |
          mv hook_engine_ios_final.cpp hook_engine_ios_final.mm
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -target arm64-apple-ios12.0 -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -std=c++17 -I. \
            -framework Foundation -framework UIKit \
            -install_name @rpath/libIOSVISION.dylib \
            hook_engine_ios_final.mm fishhook.c \
            -o libIOSVISION.dylib

      - name: Compile EMPTY isolation dylib (no ctor / no hook / no framework)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -target arm64-apple-ios12.0 -isysroot "$SDK" \
            -dynamiclib -std=c++17 \
            -install_name @executable_path/Frameworks/libIOSVISION.dylib \
            empty_dylib.cpp \
            -o libIOSVISION_empty.dylib

      - name: Ad-hoc codesign (avoid unsigned dylib rejected by dyld)
        run: |
          codesign --force --sign - libIOSVISION.dylib || true
          codesign --force --sign - libIOSVISION_empty.dylib || true
          codesign -dvv libIOSVISION.dylib 2>&1 | head -20 || true

      - name: Verify
        run: |
          file libIOSVISION.dylib
          lipo -info libIOSVISION.dylib
          otool -L libIOSVISION.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: ios-dylibs
          path: |
            libIOSVISION.dylib
            libIOSVISION_empty.dylib

  # 可选：把解密 IPA 以 base.ipa 为名传到本仓库 Release 后，重跑本流程即可直接产出可装 IPA。
  # 没有 base.ipa 时本 job 自动跳过（仅编 dylib），不影响上面的 build。
  inject:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dylib artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-dylibs
          path: .

      - name: Try fetch base IPA from release 'base'
        id: base
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download base -R nbzt8p6yjd-sys/ios-build --pattern "base.ipa" -D . || echo "NO_BASE"

      - name: Inject dylib + repackage IPA
        if: steps.base.outcome == 'success'
        run: |
          pip3 install --quiet lief
          python3 inject_dylib.py --ipa base.ipa --dylib libIOSVISION.dylib --out dst-private-final.ipa

      - name: Upload final IPA
        if: steps.base.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dst-private-final-ipa
          path: dst-private-final.ipa
