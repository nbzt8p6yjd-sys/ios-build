name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install git cmake clang llvm make wget xz-utils -y

      - name: 拉取osxcross交叉编译工具
        run: |
          rm -rf ~/osxcross
          git clone https://gitcode.com/mirrors/tpoechtrager/osxcross.git ~/osxcross
          cd ~/osxcross
          rm -rf tarballs
          mkdir tarballs
          wget https://gitcode.com/xybp888/iOS-SDKs/raw/main/iPhoneOS17.0.sdk.tar.xz -O tarballs/iPhoneOS17.0.sdk.tar.xz
          UNATTENDED=1 ./build.sh
          echo "export PATH=$HOME/osxcross/target/bin:$PATH" >> ~/.bashrc
          source ~/.bashrc

      - name: CMake编译动态库
        run: |
          source ~/.bashrc
          IOS_SDK="$HOME/osxcross/target/SDK/iPhoneOS17.0.sdk"
          mkdir build && cd build
          cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${IOS_SDK}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            ..
          make -j4

      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          name: ios-lib-output
          path: build/libIOSVISION.dylib
